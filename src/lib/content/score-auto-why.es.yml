arousal:
  - from: -10
    to: -1
    text: "Exhalación larga, menor tensión muscular, menos urgencia motora, pulso bajando y postura más suelta."
  - from: 0
    to: 3
    text: "Respiración pareja, movimientos económicos, poca impulsividad, mirada estable y escasos signos genitales o de búsqueda activa de más estímulo."
  - from: 4
    to: 6
    text: "Empieza a notarse encendido corporal sin perder regulación: respiración algo más rápida, mayor tono muscular, más orientación al estímulo, micromovimientos y sensación de energía disponible pero manejable."
  - from: 7
    to: 10
    text: "Respiración marcada, pulso alto, inquietud motora, urgencia de actuar, foco estrechado y expresiones involuntarias de excitación como tensión, gemidos o búsqueda intensa de estímulo."

trance:
  - from: -10
    to: -1
    text: "Alerta y chequeo externo. Ojos más abiertos, orientación rápida al entorno, sobresalto fácil, pensamiento vigilante y recuperación del control consciente fino."
  - from: 0
    to: 3
    text: "Ubicadx en contexto. Respuesta rápida, monitoreo del entorno, lenguaje interno activo y no hay gran distorsión del tiempo ni del cuerpo."
  - from: 4
    to: 6
    text: "Aparece absorción parcial. Menos diálogo interno, atención sostenida en una fuente, respuestas algo más lentas y cierta pérdida de referencia temporal, pero todavía con capacidad clara de modular y decidir."
  - from: 7
    to: 10
    text: "La absorción domina la experiencia. Mirada perdida o semicerrada, respuesta lenta, menor registro del entorno, tiempo subjetivo alterado y señales de entrega, disolución o disociación funcional del control consciente."

pleasure:
  - from: -10
    to: -1
    text: "Predominan marcadores de aversión o aspereza: muecas, retirada, contención corporal, respiración cortada o incomodidad sostenida, aunque el contexto pueda permitir relectura erótica posterior."
  - from: 0
    to: 3
    text: "La sensación puede ser neutra o tenue, sin demasiada expresión de gusto ni búsqueda inmediata de repetir, aunque la práctica sirva como puente para otra cosa."
  - from: 4
    to: 6
    text: "Se perciben sensaciones agradables claras. Relajación facial, pequeños sonidos de gusto, acercamiento al estímulo y deseo de sostenerlo, aunque sin desborde ni intensidad extrema."
  - from: 7
    to: 10
    text: "El placer es evidente y sostenido. Gemidos o sonrisas involuntarias, entrega al estímulo, contracciones placenteras, deseo claro de que continúe y fuerte orientación corporal hacia lo que se siente bien."

dopamine:
  - from: -10
    to: -1
    text: "Más que empujar a repetir, corta momentum. Baja la persecución del estímulo, reduce la urgencia de insistir y deja una sensación de cierre, saciedad o reset motivacional."
  - from: 0
    to: 3
    text: "Puede gustar, pero no genera mucha tracción conductual: no aparece tanta fantasía anticipatoria, ni urgencia de volver enseguida, ni rumiación posterior sobre repetir."
  - from: 4
    to: 6
    text: "Deja interés por repetir y cierta anticipación: la atención vuelve a la práctica, aparece curiosidad por seguir o retomar, pero todavía sin sesgo persecutorio fuerte."
  - from: 7
    to: 10
    text: "Predomina la motivación apetitiva: ganas intensas de volver, planificar la próxima tanda, estirar la experiencia o buscar más estímulo, con foco atencional capturado por la expectativa de recompensa."

endorphins:
  - from: -10
    to: -1
    text: "En vez de afterglow deja costo: fatiga, vacío, bajón o sensación de crash, con poca analgesia y escasa mejora del humor post-práctica."
  - from: 0
    to: 3
    text: "Casi no deja huella post-práctica: poco alivio, poca analgesia, escaso cambio en el humor y retorno bastante rápido al estado basal."
  - from: 4
    to: 6
    text: "Deja alivio apreciable después: cuerpo más suelto, descenso del dolor o la fricción interna, sensación de descarga y un bienestar moderado posterior."
  - from: 7
    to: 10
    text: "El afterglow es fuerte: analgesia clara, euforia tranquila, sonrisa involuntaria, cuerpo liviano y una sensación de recompensa somática que dura un rato después de terminar."

oxytocin:
  - from: -10
    to: -1
    text: "Tiende a enfriar lo vincular. Más distancia, menos ternura, menor deseo de contacto o dificultad para entrar en confianza, incluso si hay estimulación intensa."
  - from: 0
    to: 3
    text: "La práctica se siente más técnica, instrumental o individual. Poco impulso a abrazar, cuidar, mirar o sostener al otro, y escasos marcadores de ternura corporal."
  - from: 4
    to: 6
    text: "Aparece calidez relacional moderada. Más facilidad para acercarse, tocar suave, confiar, quedarse cerca y sentir cierta ternura o apertura emocional."
  - from: 7
    to: 10
    text: "Predominan señales de vínculo y apego. Deseo de abrazar o ser abrazadx, confianza alta, mirada blanda, ternura espontánea, sensación de intimidad y fuerte orientación al contacto afiliativo."

energy:
  - from: 0
    to: 3
    text: "Requiere muy poco costo físico o mental. Se puede sostener con poca reserva energética, en quietud o con esfuerzo mínimo."
  - from: 4
    to: 6
    text: "Pide presencia corporal o mental sostenida. Hay trabajo atencional, respiratorio o motor moderado, pero sin llegar a drenar por completo."
  - from: 7
    to: 10
    text: "Exige bastante recurso. Esfuerzo físico real, coordinación, resistencia o mucha dedicación mental, con señales de cansancio acumulativo si se prolonga."
