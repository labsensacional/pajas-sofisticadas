arousal:
  - from: -10
    to: -1
    text: "Exhalación larga, menos tensión, menos urgencia motora, pulso bajando y postura más suelta."
  - from: 0
    to: 3
    text: "Respiración pareja, movimientos económicos, poca impulsividad, mirada estable y poca búsqueda de más estímulo."
  - from: 4
    to: 6
    text: "Hay encendido corporal sin perder regulación: respiración más rápida, más tono muscular, más orientación al estímulo y energía todavía manejable."
  - from: 7
    to: 10
    text: "Respiración marcada, pulso alto, inquietud motora, urgencia de actuar, foco estrechado y excitación involuntaria."

trance:
  - from: -10
    to: -1
    text: "Alerta y chequeo externo: ojos más abiertos, orientación rápida al entorno, sobresalto fácil y pensamiento vigilante."
  - from: 0
    to: 3
    text: "Ubicadx en contexto: respuesta rápida, monitoreo del entorno, lenguaje interno activo y poca distorsión del tiempo o del cuerpo."
  - from: 4
    to: 6
    text: "Aparece absorción parcial: menos diálogo interno, atención sostenida, respuestas más lentas y algo de distorsión temporal, pero con decisión intacta."
  - from: 7
    to: 10
    text: "La absorción domina: mirada perdida o semicerrada, respuesta lenta, menos registro del entorno y señales de entrega o disociación funcional."

pleasure:
  - from: -10
    to: -1
    text: "Predominan la aspereza, el costo o la incomodidad corporal: muecas, retirada, contención y poco bienestar."
  - from: 0
    to: 3
    text: "La sensación es tenue o neutra, con poco agrado directo o poco residuo placentero, aunque sirva como puente."
  - from: 4
    to: 6
    text: "Hay sensaciones agradables claras o afterglow moderado: relajación, alivio, cuerpo más contento y ganas de sostenerlo."
  - from: 7
    to: 10
    text: "El placer o bienestar es claro y sostenido: alivio, saciedad, cuerpo orientado a lo que se siente bien y buen residuo después."

dopamine:
  - from: -10
    to: -1
    text: "Más que empujar a repetir, corta momentum: baja la persecución del estímulo y deja cierre, saciedad o reset."
  - from: 0
    to: 3
    text: "Puede gustar, pero genera poca tracción: poca fantasía anticipatoria, poca urgencia de volver y poco impulso de insistir."
  - from: 4
    to: 6
    text: "Deja interés por repetir y cierta anticipación: la atención vuelve a la práctica y aparece curiosidad por seguir."
  - from: 7
    to: 10
    text: "Predomina la motivación apetitiva: ganas intensas de volver, estirar la experiencia o buscar más, con foco en la recompensa."

oxytocin:
  - from: -10
    to: -1
    text: "Lo social pesa en tono negativo: humillación, engaño, rechazo, distancia o tensión relacional."
  - from: 0
    to: 3
    text: "Lo social casi no pesa. La práctica se siente más técnica, instrumental o individual."
  - from: 4
    to: 6
    text: "Aparece carga social moderada: entrega, aceptación, reconocimiento o cierta conexión, sin dominar todo."
  - from: 7
    to: 10
    text: "Lo social domina en tono positivo: confianza, admiración, conexión, aceptación, entrega o fuerte orientación al vínculo."

energy:
  - from: 0
    to: 3
    text: "Requiere muy poco costo físico o mental. Se sostiene con poca energía, en quietud o con esfuerzo mínimo."
  - from: 4
    to: 6
    text: "Pide presencia corporal o mental sostenida: trabajo atencional, respiratorio o motor moderado, sin drenar por completo."
  - from: 7
    to: 10
    text: "Exige bastante recurso: esfuerzo físico real, coordinación, resistencia o mucha dedicación mental, con cansancio si se prolonga."
